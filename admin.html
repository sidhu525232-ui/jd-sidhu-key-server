<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>JD X SIDHU Admin</title>
<body style="background:#07080c;color:#fff;font-family:system-ui;padding:14px;max-width:560px;margin:auto">
<h2 style="color:#ffb300">JD X SIDHU ⚡ Key Admin</h2>
<input id=pw type=password placeholder="Admin password" style="width:100%;padding:10px;margin:4px 0">
<select id=plan style="padding:10px"><option value=7>7 days</option><option value=15>15 days</option><option value=30>30 days</option><option value=lifetime>Lifetime</option></select>
<input id=cnt type=number value=1 min=1 max=100 style="padding:10px;width:70px">
<button onclick=gen()>Generate</button> <button onclick=list()>List</button>
<pre id=out style="white-space:pre-wrap;background:#111;padding:10px;border-radius:8px"></pre>
<input id=rk placeholder="Key to expire (JDS-....)" style="width:100%;padding:10px"> 
<button onclick=rev()>Expire key</button> <button onclick=unb()>Unbind device</button>
<script>
const h=()=>({'Content-Type':'application/json','x-admin-password':pw.value});
const post=async(p,b)=>out.textContent=JSON.stringify(await (await fetch(p,{method:'POST',headers:h(),body:JSON.stringify(b)})).json(),null,1);
const gen=()=>post('/api/admin/generate',{plan:plan.value,count:+cnt.value});
const rev=()=>post('/api/admin/revoke',{key:rk.value});
const unb=()=>post('/api/admin/unbind',{key:rk.value});
const list=async()=>out.textContent=JSON.stringify(await (await fetch('/api/admin/list',{headers:h()})).json(),null,1);
</script>
